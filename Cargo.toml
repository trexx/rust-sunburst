[workspace]
resolver = "3"
members = [
    "sunburst-core",
    "sunburst-capture",
    "sunburst-encode",
    "sunburst-audio",
    "sunburst-input",
    "sunburst-net",
    "sunburst-server",
    "sunburst-web",
    "sunburst-android",

    # Phase 0 throwaway. A workspace member so it is type-checked in the same
    # pass as everything else, and deleted with the rest of spikes/ when Phase 0
    # closes.
    "spikes/probe-windows",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-2.0-or-later"
repository = "https://github.com/trexx/sunburst"

[workspace.dependencies]
sunburst-core = { path = "sunburst-core" }
sunburst-net = { path = "sunburst-net" }
sunburst-web = { path = "sunburst-web" }

blake3 = { version = "1.8", default-features = false, features = ["std"] }

# Control plane only. CLAUDE.md permits tokio in sunburst-server; sunburst-web is
# the same plane and never sits between the frame path and anything.
tokio = { version = "1.53", default-features = false, features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "fs", "process"] }
hyper = { version = "1.11", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
# hyper 1.x moved body helpers out of the core crate. Collecting a request body
# by hand means writing an async Body impl, which is the one part of this that
# is genuinely easy to get subtly wrong.
http-body-util = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# The admin token and the pairing PIN both have to be unguessable, so they need
# the OS CSPRNG rather than a hash of the clock. This is the crate `rand` itself
# uses underneath, without the distribution machinery we have no use for.
getrandom = "0.4"
subtle = "2.6"
thiserror = "2.0"

[workspace.lints.rust]
# The FFI crates are largely unsafe transcription; making every unsafe operation
# name itself is what keeps the blast radius of a mistake readable.
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
# CLAUDE.md asks for comments explaining why. For unsafe blocks that is not a
# style preference, so the compiler asks rather than the reviewer.
undocumented_unsafe_blocks = "warn"

# Release builds are what the latency budget is written against; never measure a
# debug build and never ship one.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
# Frame-path stalls are diagnosed from stack traces on a machine that is not
# this one, so the symbols are worth more than the binary size.
debug = "line-tables-only"

# No [profile.bench] override: it already inherits from release, and cargo
# ignores `panic` for test and bench profiles, so criterion still unwinds
# despite `panic = "abort"` above.
