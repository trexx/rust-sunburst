[package]
name = "probe-windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[target.'cfg(windows)'.dependencies]
# For the QPC clock. The capture loop times grabs, and there is no reason to
# grow a second tick source next to the one the whole project measures with.
sunburst-core.workspace = true

windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",

    # The latency harness: a window to present from, and Windows Graphics
    # Capture, which is WinRT and needs both the projection and the Win32
    # interop shims that turn its surfaces back into D3D11 textures.
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Graphics_Capture",
    "Graphics_DirectX_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_System_WinRT_Direct3D11",

    # The pad spike: HIDMaestro's shared-memory sections, and reading HID input
    # reports to time a forwarded device against a directly-connected one.
    "Win32_System_Memory",
    "Win32_System_IO",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Devices_DeviceAndDriverInstallation",
] }
