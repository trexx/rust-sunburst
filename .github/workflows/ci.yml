# SPDX-License-Identifier: GPL-2.0-or-later
#
# What this can and cannot tell you: it compiles every target and runs the
# host-testable tests. It cannot measure latency — no GPU, no hardware decoder,
# no host, and neither client ABI is the runner's. Do not add emulator
# benchmarks to make it look like it can. Real latency work happens on real
# hardware and HARDWARE_TESTING.md tracks it.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  # On demand, from the Actions tab, for any branch: the one way to get the
  # Windows artifact for a PR branch without merging it first.
  workflow_dispatch:

# RUSTFLAGS is set per job, not here: Cargo takes extra flags from exactly one
# source, and RUSTFLAGS beats `.cargo/config.toml`'s per-target rustflags. Set
# workflow-wide it would strip the target-CPU flags (NEON on armv7, AVX2 on the
# server) from the artifacts the boxes run. The lint/test jobs set it; the
# artifact jobs (package, android) leave the config's flags in force.
env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (tests, clippy, fmt)
    uses: trexx/actions/.github/workflows/rust-check.yml@main
    permissions:
      contents: read
    with:
      # Windows is the real MSVC build.
      os: '["ubuntu-latest", "windows-latest"]'
      cargo_args: --workspace

  package:
    name: Windows binaries (artifact)
    runs-on: windows-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: trexx/actions/.github/actions/checkout@main
      - uses: trexx/actions/.github/actions/rust-cache@main
      - name: Build the server and fakeclient (release)
        run: cargo build --release -p sunburst-server -p fakeclient
      - uses: trexx/actions/.github/actions/setup-node@main
        with:
          node-version: 26.13.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the web UI
        run: |
          npm ci
          npm run build
        working-directory: web
      - name: Stage the bundle
        # The server serves the UI from a runtime assets dir; ship it beside the
        # binaries so `web.assets_dir` can point at `web/`.
        shell: bash
        run: |
          mkdir -p dist/web
          cp target/release/sunburst-server.exe dist/
          cp target/release/fakeclient.exe dist/
          cp -r web/dist/* dist/web/
      - uses: trexx/actions/.github/actions/upload-artifact@main
        with:
          name: sunburst-windows
          path: dist/
          if-no-files-found: error

  web:
    name: Management UI
    runs-on: ubuntu-latest
    steps:
      - uses: trexx/actions/.github/actions/checkout@main
      - uses: trexx/actions/.github/actions/setup-node@main
        with:
          node-version: 26.13.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      # `build` runs `tsc -b` first, so this covers the type check too.
      - run: npm run build
        working-directory: web

  android:
    name: Android (both ABIs + Gradle)
    runs-on: ubuntu-latest
    steps:
      - uses: trexx/actions/.github/actions/checkout@main
      - uses: trexx/actions/.github/actions/rust-cache@main

      # The runner ships an Android SDK and NDK already. Using them avoids a
      # third-party action and a version string that would have to be guessed
      # and then kept correct.
      - name: Put the NDK toolchain on PATH
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"
          rustup target add aarch64-linux-android armv7-linux-androideabi

      - name: arm64-v8a (Shield)
        run: cargo build --release -p sunburst-android --target aarch64-linux-android

      # Host clippy only sees the crate's empty (non-Android) shell, so lint the
      # real Android target here — the same reasoning as `cargo xwin clippy` for
      # the Windows-only crates. `-D warnings` is passed here rather than through
      # RUSTFLAGS, which would override the per-ABI CPU flags (see `env:` above).
      - name: Clippy the Android client
        run: cargo clippy -p sunburst-android --all-targets --target aarch64-linux-android -- -D warnings

      # armeabi-v7a is not optional: the Homatics ships a 32-bit userspace on a
      # 64-bit SoC, so dropping it drops half the supported hardware.
      - name: armeabi-v7a (Homatics)
        run: cargo build --release -p sunburst-android --target armv7-linux-androideabi

      # Cache the hash-verified firmware so most builds skip the Microsoft
      # download entirely; it is fetched only on a cold miss. The key is tied to
      # fetch-firmware.sh, so changing the pinned hash or the URL invalidates the
      # cache and forces a fresh, re-verified fetch. Repo-private CI storage, not
      # a public artifact.
      - name: Cache the dongle firmware
        id: fw-cache
        uses: trexx/actions/.github/actions/cache@main
        with:
          path: android/app/src/main/assets/xone_dongle_fw.bin
          key: xone-dongle-fw-${{ hashFiles('scripts/fetch-firmware.sh') }}

      # The firmware is Microsoft's and never committed (CLAUDE.md "Licensing").
      # On a cache miss, fetch-firmware.sh downloads Microsoft's driver package,
      # extracts the blob into the gitignored asset path so the assembleDebug below
      # packages it, and verifies it against the hash pinned in the script — the
      # download is plain http, so the hash is what rejects a reissued or tampered
      # package. The cache then serves it to later builds (PRs included).
      - name: Fetch the dongle firmware (bundled into the APK)
        if: steps.fw-cache.outputs.cache-hit != 'true'
        env:
          # Overrides the hash pinned in the script, should Microsoft reissue it.
          # Unset (incl. on fork PRs, where secrets are withheld) → the pinned hash.
          SUNBURST_FW_SHA256: ${{ secrets.SUNBURST_FW_SHA256 }}
        run: |
          sudo apt-get update && sudo apt-get install -y cabextract
          scripts/fetch-firmware.sh

      # Sign with the project's stable debug key, so each published APK installs
      # over the last instead of needing an uninstall (which wipes the pairing).
      # Fork PRs get no secrets and fall back to a throwaway key, as before.
      - name: Install the stable debug signing key
        uses: trexx/actions/.github/actions/decode-keystore@main
        with:
          keystore_base64: ${{ secrets.SUNBURST_DEBUG_KEYSTORE_B64 }}
          filename: sunburst-debug.keystore
          env_var: SUNBURST_DEBUG_KEYSTORE
          missing_message: 'no SUNBURST_DEBUG_KEYSTORE_B64 secret: this APK gets a throwaway key and will not install over another build'

      - name: Gradle build and unit tests
        # The Gradle wrapper fetches its own JDK via the toolchain resolver, and
        # `ndkVersion` in app/build.gradle installs the pinned NDK if the
        # runner's differs. The app's `cargoBuildJni` task cross-compiles the
        # client cdylib for both ABIs and stages it in jniLibs, so assembleDebug
        # produces an APK that actually contains the native library.
        # The wrapper lives in android/, so run from there (there is no root gradlew).
        working-directory: android
        run: ./gradlew testDebugUnitTest assembleDebug --console=plain

      - name: Assert the client library is packaged in the APK
        # The whole point of the build wiring: a debug APK with no `lib/*.so`
        # would install and then do nothing on the boxes.
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          for abi in arm64-v8a armeabi-v7a; do
            unzip -l "$apk" | grep -q "lib/$abi/libsunburst_android.so" \
              || { echo "missing lib/$abi/libsunburst_android.so in the APK"; exit 1; }
          done
          echo "both ABIs packaged"

      - name: Assert the packaged client library is optimised
        # A debug (opt-level 0) client cannot keep up with a 4K stream: the
        # socket overflows and video and audio stutter. Overflow-check panic
        # strings exist only in a debug-profile build, so their absence is the
        # tell.
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          dir=$(mktemp -d)
          unzip -q "$apk" 'lib/*' -d "$dir"
          for so in "$dir"/lib/*/libsunburst_android.so; do
            if strings "$so" | grep -q 'attempt to add with overflow'; then
              echo "$so is a debug build"; exit 1
            fi
          done
          echo "client library is a release build"

      # Fail loudly rather than ship a silently firmware-less APK if the fetch
      # above regressed.
      - name: Assert the firmware is packaged in the APK
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$apk" | grep -q "assets/xone_dongle_fw.bin" \
            || { echo "firmware not packaged in the APK"; exit 1; }
          echo "firmware packaged"

      # The sideloadable client for the Shield + Homatics, so the boxes get an
      # APK (both ABIs, firmware bundled) without building on them — the Android
      # twin of the Windows `package` job. Debug-signed: installable via sideload,
      # not Play. Uploaded on PRs too, so a reviewer can grab the build.
      - name: Publish the APK
        uses: trexx/actions/.github/actions/upload-artifact@main
        with:
          name: sunburst-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
