# SPDX-License-Identifier: GPL-2.0-or-later
#
# What this can and cannot tell you: it compiles every target and runs the
# host-testable tests. It cannot measure latency — no GPU, no hardware decoder,
# no host, and neither client ABI is the runner's. Do not add emulator
# benchmarks to make it look like it can. Real latency work happens on real
# hardware and HARDWARE_TESTING.md tracks it.

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  linux:
    name: Linux (tests, clippy, fmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      # The zero-allocation and synthetic-pipeline tests live here. They are the
      # only automated defence of CLAUDE.md's first hot-path rule.
      - run: cargo test --workspace

  windows:
    name: Windows (real MSVC build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      # The five Windows-only crates compile to nothing on Linux, so this is the
      # only job that type-checks them for real. `cargo xwin` locally catches the
      # same errors sooner; this is the backstop.
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace

  # Build the artifacts a Windows host is needed for and publish them, so the
  # 4070 box gets a runnable server + fakeclient without building on the box.
  # Only on a push to main (and on demand) — PRs stay fast with the type-check
  # above.
  package:
    name: Windows binaries (artifact)
    runs-on: windows-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - name: Build the server and fakeclient (release)
        run: cargo build --release -p sunburst-server -p fakeclient
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the web UI
        run: |
          npm ci
          npm run build
        working-directory: web
      - name: Stage the bundle
        # The server serves the UI from a runtime assets dir; ship it beside the
        # binaries so `web.assets_dir` can point at `web/`.
        shell: bash
        run: |
          mkdir -p dist/web
          cp target/release/sunburst-server.exe dist/
          cp target/release/fakeclient.exe dist/
          cp -r web/dist/* dist/web/
      - uses: actions/upload-artifact@v4
        with:
          name: sunburst-windows
          path: dist/
          if-no-files-found: error

  web:
    name: Management UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      # `build` runs `tsc -b` first, so this covers the type check too.
      - run: npm run build
        working-directory: web

  android:
    name: Android (both ABIs + Gradle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2

      # The runner ships an Android SDK and NDK already. Using them avoids a
      # third-party action and a version string that would have to be guessed
      # and then kept correct.
      - name: Put the NDK toolchain on PATH
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"
          rustup target add aarch64-linux-android armv7-linux-androideabi

      - name: arm64-v8a (Shield)
        run: cargo build -p sunburst-android --target aarch64-linux-android

      # armeabi-v7a is not optional: the Homatics ships a 32-bit userspace on a
      # 64-bit SoC, so dropping it drops half the supported hardware.
      - name: armeabi-v7a (Homatics)
        run: cargo build -p sunburst-android --target armv7-linux-androideabi

      - name: Gradle build and unit tests
        # The Gradle wrapper fetches its own JDK via the toolchain resolver, and
        # `ndkVersion` in app/build.gradle installs the pinned NDK if the
        # runner's differs. The app's `cargoBuildJni` task cross-compiles the
        # client cdylib for both ABIs and stages it in jniLibs, so assembleDebug
        # produces an APK that actually contains the native library.
        run: ./gradlew -p android testDebugUnitTest assembleDebug --console=plain

      - name: Assert the client library is packaged in the APK
        # The whole point of the build wiring: a debug APK with no `lib/*.so`
        # would install and then do nothing on the boxes.
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          for abi in arm64-v8a armeabi-v7a; do
            unzip -l "$apk" | grep -q "lib/$abi/libsunburst_android.so" \
              || { echo "missing lib/$abi/libsunburst_android.so in the APK"; exit 1; }
          done
          echo "both ABIs packaged"
