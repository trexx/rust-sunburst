# SPDX-License-Identifier: GPL-2.0-or-later
#
# Compile the NvFBC path's ARGB10->P010 CUDA kernel to PTX — an artifact a
# CUDA toolkit produces that the Linux dev host and the `cargo xwin` build do not
# have (the project uses the driver API, nvcuda.dll, with no toolkit at runtime).
# The driver JITs the PTX at load, so it is forward-compatible across GPUs.
#
# Manual-only (workflow_dispatch): not part of the CI gate. Download the artifact
# and vendor both files over sunburst-encode/cuda/argb10_to_p010.ptx and
# argb_to_nv12.ptx, then commit them with the run id, the nvcc version and the
# SHA-256s (SHA256SUMS.txt). Rerun whenever a .cu file changes;
# sunburst-encode/tests/ptx_vendored.rs checks the entry points.

name: CUDA kernel PTX

on:
  workflow_dispatch:
    inputs:
      arch:
        description: PTX virtual arch to target (JITs up to the runtime GPU)
        default: compute_75

jobs:
  ptx:
    name: nvcc -ptx (P010 + NV12 kernels)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install the CUDA toolkit (nvcc)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nvidia-cuda-toolkit
          nvcc --version

      - name: Compile to PTX
        run: |
          set -euo pipefail
          cd sunburst-encode/cuda
          # The HEVC/AV1 P010 kernel and the H.264 SDR NV12 kernel (two entry
          # points, SDR + tonemap). Both are vendored into the repo.
          nvcc -ptx -arch=${{ github.event.inputs.arch }} \
            argb10_to_p010.cu -o argb10_to_p010.ptx
          nvcc -ptx -arch=${{ github.event.inputs.arch }} \
            argb_to_nv12.cu -o argb_to_nv12.ptx
          echo "== head of generated PTX =="
          head -12 argb10_to_p010.ptx
          sha256sum argb10_to_p010.ptx argb_to_nv12.ptx | tee SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: cuda-ptx-${{ github.event.inputs.arch }}
          path: |
            sunburst-encode/cuda/argb10_to_p010.ptx
            sunburst-encode/cuda/argb_to_nv12.ptx
            sunburst-encode/cuda/SHA256SUMS.txt
          if-no-files-found: error
