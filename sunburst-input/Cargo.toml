[package]
name = "sunburst-input"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
sunburst-core.workspace = true
sunburst-net.workspace = true
# Gamepad profiles are HIDMaestro's JSON, parsed once at controller creation —
# config-plane work off the video path, the same place CLAUDE.md permits serde
# (sunburst-web), never sunburst-core.
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_Security",
    # Virtual-pad device creation: stage the INF into the driver store and
    # register a ROOT-enumerated HID node the HIDMaestro UMDF2 driver binds to.
    "Win32_Devices_DeviceAndDriverInstallation",
    # SwDeviceCreate, for the SWD-enumerated Xbox companion device.
    "Win32_Devices_Enumeration_Pnp",
    "Win32_Devices_Properties",
    "Win32_System_Registry",
] }
