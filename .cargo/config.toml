# The NDK's per-API-level wrapper scripts must be on PATH. Both installed NDKs
# (27.0.12077973 and 29.0.14206865) provide these exact names; android/ pins
# 29.0.14206865 to match moonlight-trexx.
#
#   export PATH="$ANDROID_HOME/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
#
# API 30 is deliberate and not merely the minSdk: KEY_LOW_LATENCY and
# Surface.setFrameRate() both landed exactly there.

[target.aarch64-linux-android]
linker = "aarch64-linux-android30-clang"

[target.armv7-linux-androideabi]
linker = "armv7a-linux-androideabi30-clang"

# `cc` (sunburst-gip-bridge's vendored C/C++, built only for Android) guesses the
# wrong compiler name for armv7 — `arm-linux-androideabi-clang`, an old
# standalone-toolchain spelling the NDK does not ship. Point it at the real
# per-API wrapper (armv7a, API 30), matching the linker above. arm64's guess is
# already correct, so it needs no override.
[env]
CC_armv7_linux_androideabi = "armv7a-linux-androideabi30-clang"
CXX_armv7_linux_androideabi = "armv7a-linux-androideabi30-clang++"
