[package]
name = "sunburst-net"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
sunburst-core.workspace = true
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
# UDP send offload (WSASendMsg + UDP_SEND_MSG_SIZE). Cross-platform code lives
# in the crate; only the offload sender is Windows-only.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_System_IO",
] }
windows-core = "0.62"
