[package]
name = "sunburst-android"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib"]

[lints]
workspace = true

[dependencies]
sunburst-core.workspace = true
sunburst-net.workspace = true

# The JNI shim, decode driving and logging are Android-only. On the host the
# crate compiles to an (empty) cdylib, so `cargo test`/clippy stay green while
# the real client is built and cross-compiled for the two ABIs.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk = { version = "0.9", features = ["media", "api-level-30"] }
ndk-sys = "0.6"
ndk-context = "0.1"
libc = "0.2"
getrandom = "0.4"
log = "0.4"
android_logger = "0.14"
